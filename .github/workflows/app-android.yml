# Compila la app de Android (APK de prueba) cada vez que cambia la web o la carpeta app-movil,
# y la deja en la página de descargas del repositorio: Releases → "App Android".
name: App Android

on:
  push:
    branches: [main]
    paths: ["index.html", "config.js", "app-movil/**", ".github/workflows/app-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto Android
        run: |
          npm ci --no-audit --no-fund
          npm run android
          # número de versión que sube en cada compilación, para que el móvil acepte la actualización
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          # misma firma en todas las compilaciones de prueba (si no, el móvil no deja actualizar encima)
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: app-movil/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/mes-malgrat.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android
          name: App Android
          make_latest: true
          body: |
            APK de prueba de la app Mes Malgrat (versión 1.0.${{ github.run_number }}).
            Descarga `mes-malgrat.apk` desde el móvil e instálala (Android pedirá permitir apps de esta fuente).
          files: app-movil/android/app/build/outputs/apk/debug/mes-malgrat.apk
          fail_on_unmatched_files: true
